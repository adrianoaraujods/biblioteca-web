name: CI - Biblioteca Web (Java + React)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ========================================
  # JOB 1: TESTES DO BACKEND (Java/Spring Boot)
  # ========================================
  test-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🧪 Testes Unitários (JUnit 5 + Mockito)
        run: mvn test -Dtest="*ControllerTest" -Dsurefire.failIfNoSpecifiedTests=false -B

      - name: 🔗 Testes de Integração (@SpringBootTest + H2)
        run: mvn test -Dtest="IntegracaoTest" -Dsurefire.failIfNoSpecifiedTests=false -B

      - name: 📊 Todos os testes + cobertura (JaCoCo)
        run: |
          mvn verify -B
          echo "✅ Relatório de cobertura gerado em target/site/jacoco/"

  # ========================================
  # JOB 2: TESTES DO FRONTEND (React)
  # ========================================
  test-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 📦 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🧪 Testes unitários React (Jest)
        run: npm test -- --watchAll=false --passWithNoTests

      - name: 🏗️ Build de produção
        run: npm run build

  # ========================================
  # JOB 3 (extra): DOCKER + TESTES DE ACEITAÇÃO
  # (deploy na AWS não é exigido)
  # ========================================
  deploy:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🐳 Build das imagens Docker
        run: docker compose build

      - name: ✅ Testes de Aceitação (curl)
        run: |
          docker compose up -d
          # Espera a API subir (até ~2 min)
          for i in $(seq 1 24); do
            curl -sf http://localhost:8080/api/autores > /dev/null && break
            sleep 5
          done
          curl -f http://localhost:8080/api/autores || exit 1
          curl -f http://localhost:3000 > /dev/null || exit 1
          if curl -sf http://localhost:8080/api/livros > /dev/null; then
            AUTOR_ID=$(curl -sf -X POST http://localhost:8080/api/autores \
              -H "Content-Type: application/json" \
              -d '{"nome":"Machado de Assis","nacionalidade":"Brasileira","dataNascimento":"1839-06-21"}' \
              | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
            curl -f -X POST http://localhost:8080/api/livros \
              -H "Content-Type: application/json" \
              -d "{\"titulo\":\"Dom Casmurro\",\"isbn\":\"978-8535910667\",\"anoPublicacao\":1899,\"genero\":\"Romance\",\"autor\":{\"id\":$AUTOR_ID}}" || exit 1
          fi
          echo "✅ Testes de aceitação passaram!"

      - name: 🧹 Derrubar containers
        if: always()
        run: docker compose down -v
